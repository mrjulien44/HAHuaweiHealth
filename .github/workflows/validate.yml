name: Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v5

      - name: 🧪 Run Hassfest
        uses: home-assistant/actions/hassfest@master

      - name: 🏪 HACS Action Validation
        uses: hacs/action@main
        with:
          category: integration
